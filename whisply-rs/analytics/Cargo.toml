[package]
edition.workspace = true
license.workspace = true
name = "whisply-analytics"
version.workspace = true

[lib]
doctest = false
name = "whisply_analytics"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
codex-app-server-protocol = { workspace = true }
whisply-git-utils = { workspace = true }
whisply-login = { workspace = true }
whisply-model-provider = { workspace = true }
whisply-plugin = { workspace = true }
whisply-protocol = { workspace = true }
whisply-state = { workspace = true }
os_info = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
whisply-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
