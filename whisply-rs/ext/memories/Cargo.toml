[package]
edition.workspace = true
license.workspace = true
name = "whisply-memories-extension"
version.workspace = true

[lib]
name = "whisply_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
whisply-core = { workspace = true }
whisply-extension-api = { workspace = true }
whisply-features = { workspace = true }
whisply-otel = { workspace = true }
whisply-tools = { workspace = true }
whisply-utils-absolute-path = { workspace = true }
whisply-utils-output-truncation = { workspace = true }
whisply-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
