[package]
edition.workspace = true
license.workspace = true
name = "whisply-goal-extension"
version.workspace = true

[lib]
name = "whisply_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
whisply-analytics = { workspace = true }
whisply-core = { workspace = true }
whisply-extension-api = { workspace = true }
whisply-otel = { workspace = true }
whisply-protocol = { workspace = true }
whisply-state = { workspace = true }
whisply-tools = { workspace = true }
whisply-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
whisply-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
