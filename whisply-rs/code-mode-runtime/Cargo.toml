[package]
edition.workspace = true
license.workspace = true
name = "whisply-code-mode-runtime"
version.workspace = true

[lib]
doctest = false
name = "whisply_code_mode_runtime"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
whisply-code-mode-protocol = { workspace = true }
whisply-protocol = { workspace = true }
deno_core_icudata = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
v8 = { workspace = true, features = ["v8_enable_sandbox"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
