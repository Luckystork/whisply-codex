[package]
name = "whisply-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "whisply_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
whisply-app-server = { workspace = true }
codex-app-server-protocol = { workspace = true }
whisply-arg0 = { workspace = true }
whisply-config = { workspace = true }
whisply-core = { workspace = true }
whisply-exec-server = { workspace = true }
whisply-feedback = { workspace = true }
whisply-protocol = { workspace = true }
whisply-uds = { workspace = true }
whisply-utils-absolute-path = { workspace = true }
whisply-utils-rustls-provider = { workspace = true }
codex-whisply = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
