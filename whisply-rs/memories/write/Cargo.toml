[package]
edition.workspace = true
license.workspace = true
name = "whisply-memories-write"
version.workspace = true

[lib]
name = "whisply_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
whisply-backend-client = { workspace = true }
whisply-core = { workspace = true }
whisply-config = { workspace = true }
whisply-features = { workspace = true }
whisply-git-utils = { workspace = true }
whisply-login = { workspace = true }
whisply-model-provider = { workspace = true }
whisply-otel = { workspace = true }
whisply-protocol = { workspace = true }
whisply-rollout = { workspace = true }
whisply-rollout-trace = { workspace = true }
whisply-secrets = { workspace = true }
whisply-state = { workspace = true }
whisply-terminal-detection = { workspace = true }
whisply-utils-absolute-path = { workspace = true }
whisply-utils-output-truncation = { workspace = true }
whisply-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
whisply-model-provider-info = { workspace = true }
whisply-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
toml = { workspace = true }
wiremock = { workspace = true }
