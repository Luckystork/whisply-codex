[package]
name = "whisply-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "whisply"

[[bin]]
name = "whisply"
path = "src/main.rs"

[[bin]]
name = "logs_client"
path = "src/bin/logs_client.rs"

[lib]
name = "whisply_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
whisply-app-server = { workspace = true }
whisply-app-server-daemon = { workspace = true }
codex-app-server-protocol = { workspace = true }
whisply-app-server-test-client = { workspace = true }
whisply-arg0 = { workspace = true }
whisply-api = { workspace = true }
whisply-chatgpt = { workspace = true }
whisply-cloud-tasks = { path = "../cloud-tasks" }
whisply-utils-cli = { workspace = true }
whisply-utils-string = { workspace = true }
dirs = { workspace = true }
whisply-config = { workspace = true }
whisply-core = { workspace = true }
whisply-core-plugins = { workspace = true }
whisply-home = { workspace = true }
whisply-http-client = { workspace = true }
whisply-exec = { workspace = true }
whisply-exec-server = { workspace = true }
whisply-execpolicy = { workspace = true }
whisply-extension-api = { workspace = true }
whisply-features = { workspace = true }
whisply-git-attribution = { workspace = true }
whisply-git-utils = { workspace = true }
whisply-install-context = { workspace = true }
whisply-login = { workspace = true }
whisply-memories-write = { workspace = true }
whisply-mcp = { workspace = true }
whisply-mcp-server = { workspace = true }
whisply-model-provider = { workspace = true }
whisply-models-manager = { workspace = true }
whisply-plugin = { workspace = true }
whisply-protocol = { workspace = true }
whisply-rmcp-client = { workspace = true }
whisply-rollout = { workspace = true }
whisply-rollout-trace = { workspace = true }
whisply-sandboxing = { workspace = true }
whisply-skills-extension = { workspace = true }
whisply-state = { workspace = true }
whisply-stdio-to-uds = { workspace = true }
whisply-terminal-detection = { workspace = true }
whisply-tui = { workspace = true }
whisply-utils-absolute-path = { workspace = true }
whisply-utils-path = { workspace = true }
codex-whisply = { workspace = true }
crossterm = { workspace = true }
http = { workspace = true }
hmac = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
which = { workspace = true }
zeroize = { workspace = true }
zip = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
whisply_windows_sandbox = { package = "whisply-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
app_test_support = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
whisply-utils-cargo-bin = { workspace = true }
futures = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
tokio-tungstenite = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
# These Rust sources are intentionally Bazel-only macrobenchmarks rather than
# Cargo targets.
ignored-paths = ["e2e_benches/*.rs"]
