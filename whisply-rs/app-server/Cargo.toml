[package]
name = "whisply-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "codex-app-server"
path = "src/main.rs"

[[bin]]
name = "codex-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[[bin]]
name = "exec-server"
path = "src/bin/exec_server.rs"

[lib]
name = "whisply_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
whisply-analytics = { workspace = true }
whisply-agent-extension = { workspace = true }
whisply-arg0 = { workspace = true }
whisply-code-mode = { workspace = true }
whisply-config = { workspace = true }
whisply-connectors = { workspace = true }
whisply-core = { workspace = true }
whisply-core-plugins = { workspace = true }
whisply-home = { workspace = true }
whisply-exec-server = { workspace = true }
whisply-extension-api = { workspace = true }
whisply-external-agent-migration = { workspace = true }
whisply-features = { workspace = true }
whisply-goal-extension = { workspace = true }
whisply-git-attribution = { workspace = true }
whisply-guardian = { workspace = true }
whisply-git-utils = { workspace = true }
whisply-file-watcher = { workspace = true }
whisply-hooks = { workspace = true }
whisply-http-client = { workspace = true }
whisply-otel = { workspace = true }
whisply-plugin = { workspace = true }
whisply-shell-command = { workspace = true }
whisply-skills = { workspace = true }
whisply-skills-extension = { workspace = true }
whisply-utils-cli = { workspace = true }
whisply-utils-pty = { workspace = true }
whisply-backend-client = { workspace = true }
whisply-file-search = { workspace = true }
whisply-chatgpt = { workspace = true }
whisply-login = { workspace = true }
whisply-image-generation-extension = { workspace = true }
whisply-memories-extension = { workspace = true }
whisply-web-search-extension = { workspace = true }
codex-whisply = { workspace = true }
whisply-memories-write = { workspace = true }
whisply-mcp = { workspace = true }
whisply-mcp-extension = { workspace = true }
whisply-model-provider = { workspace = true }
whisply-models-manager = { workspace = true }
whisply-protocol = { workspace = true }
codex-app-server-protocol = { workspace = true }
whisply-app-server-transport = { workspace = true }
whisply-feedback = { workspace = true }
whisply-rmcp-client = { workspace = true }
