[package]
edition.workspace = true
license.workspace = true
name = "whisply-models-manager"
version.workspace = true

[lib]
doctest = false
name = "whisply_models_manager"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
whisply-collaboration-mode-templates = { workspace = true }
whisply-http-client = { workspace = true }
whisply-login = { workspace = true }
whisply-otel = { workspace = true }
whisply-protocol = { workspace = true }
whisply-utils-output-truncation = { workspace = true }
whisply-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
